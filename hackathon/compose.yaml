services:
  scope:
    build:
      context: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SCOPE_READ_ONLY: "true"
      SCOPE_STATE_PATH: /app/state
    volumes:
      - scope-demo-state:/app/state
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  scope-demo-state:
